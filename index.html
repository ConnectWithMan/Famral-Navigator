    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: Boolean(desc.enumerable),
              get: desc.get,
              set: function () {},
            });
          }
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (event) {
            var src = (event && event.filename) || '';
            var msg = (event && event.message) || '';
            var stack = (event && event.error && event.error.stack) || '';
            var isExtensionError =
              src.indexOf('chrome-extension://') === 0 ||
              src.indexOf('moz-extension://') === 0 ||
              stack.indexOf('chrome-extension://') !== -1 ||
              stack.indexOf('moz-extension://') !== -1;
            if (isExtensionError || msg.indexOf('Cannot set property fetch of #<Window>') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
